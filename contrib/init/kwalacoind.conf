description "KwalaCoins Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env KWALACOIND_BIN="/usr/bin/kwalacoind"
env KWALACOIND_USER="kwalacoin"
env KWALACOIND_GROUP="kwalacoin"
env KWALACOIND_PIDDIR="/var/run/kwalacoind"
# upstart can't handle variables constructed with other variables
env KWALACOIND_PIDFILE="/var/run/kwalacoind/kwalacoind.pid"
env KWALACOIND_CONFIGFILE="/etc/kwalacoin/kwalacoin.conf"
env KWALACOIND_DATADIR="/var/lib/kwalacoind"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # kwalacoind will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$KWALACOIND_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run kwalacoind."
        echo "The setting must appear in $KWALACOIND_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"KwalaCoins Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$KWALACOIND_PIDDIR"
    chmod 0755 "$KWALACOIND_PIDDIR"
    chown $KWALACOIND_USER:$KWALACOIND_GROUP "$KWALACOIND_PIDDIR"
    chown $KWALACOIND_USER:$KWALACOIND_GROUP "$KWALACOIND_CONFIGFILE"
    chmod 0660 "$KWALACOIND_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$KWALACOIND_PIDFILE" \
    --chuid $KWALACOIND_USER:$KWALACOIND_GROUP \
    --exec "$KWALACOIND_BIN" \
    -- \
    -pid="$KWALACOIND_PIDFILE" \
    -conf="$KWALACOIND_CONFIGFILE" \
    -datadir="$KWALACOIND_DATADIR" \
    -disablewallet \
    -daemon

